[project]
name = "kiln-poetry-locked"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = ["idna==3.10"]

[project.scripts]
kiln-smoke = "kiln_app:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [{ include = "kiln_app" }]

[tool.poetry.group.dev.dependencies]
pytest = "8.3.5"
